  .header-banner {

  .monticello-toggle {

  .checkbox-row {

    gap: 8px;

<script>
  var APP_VERSION = "2.3";

  // Tomche Shabbos Flatbush-style timing used by this generator:
  // candle lighting = 15 minutes before sunset; Motzei = 72 minutes after sunset.
  var CANDLE_MINUTES_BEFORE_SUNSET = 15;
  var HAVDALAH_MINUTES_AFTER_SUNSET = 72;
  var SEARCH_DAYS_AHEAD = 45;

  var quotes = [
    "Common sense is like deodorant. The people who need it most never seem to use it.",
    "A smooth sea never made a skilled sailor.",
    "The best time to plant a tree was 20 years ago. The second best time is now.",
    "Worry never robs tomorrow of its sorrow, it only saps today of its joy.",
    "You can't control the wind, but you can adjust your sails.",
    "Difficult roads often lead to beautiful destinations.",
    "A little progress each day adds up to big results.",
    "Gratitude turns what we have into enough.",
    "The smallest act of kindness is worth more than the grandest intention.",
    "Patience is not the ability to wait, but the ability to keep a good attitude while waiting.",
    "What lies behind us and what lies before us are tiny matters compared to what lies within us.",
    "Comparison is the thief of joy.",
    "Be the reason someone smiles today.",
    "Out of difficulties grow miracles.",
    "Every accomplishment starts with the decision to try.",
    "The way to get started is to quit talking and begin doing.",
    "Happiness is not by chance, but by choice.",
    "Don't watch the clock; do what it does. Keep going.",
    "Tough times never last, but tough people do.",
    "A grateful heart is a magnet for miracles.",
    "Kindness is a language the deaf can hear and the blind can see.",
    "It always seems impossible until it's done.",
    "The greatest glory in living lies not in never falling, but in rising every time we fall.",
    "Believe you can and you're halfway there.",
    "Small deeds done are better than great deeds planned.",
    "Hope is being able to see that there is light despite all of the darkness.",
    "Wherever you go, go with all your heart.",
    "Peace begins with a smile.",
    "We rise by lifting others.",
    "Every sunset brings the promise of a new dawn."
  ];

  // Brooklyn 11219 and Monticello 12701.
  var LOCATIONS = {
    BK: { lat: 40.6334, lon: -73.9968, zip: "11219" },
    MC: { lat: 41.6560, lon: -74.6904, zip: "12701" }
  };

  var FLOWERS = ["🌼", "🌸", "🌺", "🌻", "🌷", "🌹", "🪷", "🌝"];
  var DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Shabbos"];
  var remoteQuotes = [];

  window.__eventInfo = null;
  window.__locationBlocks = {};

  function fetchQuotes() {
    if (location.protocol === "file:") return Promise.resolve();
    return fetch("https://quoteslate.vercel.app/api/quotes/random?count=50&maxLength=160")
      .then(function(r) {
        if (!r.ok) throw new Error("QuoteSlate status " + r.status);
        return r.json();
      })
      .then(function(data) {
        remoteQuotes = data
          .map(function(q) { return { text: q.quote }; })
          .filter(function(q) { return q.text && q.text.length > 10 && q.text.length < 180; });
      })
      .catch(function() {
        return fetch("https://type.fit/api/quotes")
          .then(function(r) {
            if (!r.ok) throw new Error("type.fit status " + r.status);
            return r.json();
          })
          .then(function(data) {
            remoteQuotes = data.filter(function(q) {
              return q && q.text && q.text.length > 10 && q.text.length < 180;
            });
          })
          .catch(function() {
            // Silently fall back to the local quote list.
          });
      });
  }

  function getRandomQuoteText(excludeText) {
    var pool = remoteQuotes.length > 0 ? remoteQuotes : null;
    if (pool) {
      var attempts = 0;
      var nextText = excludeText || "";
      while (nextText === excludeText && attempts < 10) {
        var q = pool[Math.floor(Math.random() * pool.length)];
        nextText = (q.text || "").replace(/[\s-]+$/, "").trim();
        attempts++;
      }
      return nextText;
    }

    var next = excludeText;
    var tries = 0;
    while (next === excludeText && tries < 10) {
      next = quotes[Math.floor(Math.random() * quotes.length)];
      tries++;
    }
    return next;
  }

  function pad(n) { return n < 10 ? "0" + n : String(n); }

  function formatYmd(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  function getNYCalendarDate(offsetDays) {
    var now = new Date();
    var parts = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/New_York",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(now);

    var vals = {};
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].type !== "literal") vals[parts[i].type] = parts[i].value;
    }

    // Noon avoids DST-boundary surprises while doing calendar-day math.
    var d = new Date(parseInt(vals.year, 10), parseInt(vals.month, 10) - 1, parseInt(vals.day, 10) + (offsetDays || 0), 12, 0, 0);
    return formatYmd(d);
  }

  function addDaysYmd(ymd, days) {
    var p = ymd.split("-");
    var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10) + days, 12, 0, 0);
    return formatYmd(d);
  }

  function dateFromIso(iso) {
    var m = String(iso || "").match(/^(\d{4}-\d{2}-\d{2})/);
    return m ? m[1] : "";
  }

  function formatTimeFromIso(iso) {
    var m = String(iso || "").match(/T(\d{2}):(\d{2})/);
    if (!m) return "";
    var h = parseInt(m[1], 10);
    var min = parseInt(m[2], 10);
    var h12 = h % 12;
    if (h12 === 0) h12 = 12;
    return h12 + ":" + pad(min);
  }

  function dayNameFromYmd(ymd) {
    if (!ymd) return "";
    var p = ymd.split("-");
    var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10), 12, 0, 0);
    return DAY_NAMES[d.getDay()];
  }

  function setStatus(msg) {
    document.getElementById("status").textContent = msg;
  }

  function weatherEmoji(code) {
    code = Number(code);
    if (code === 0) return "☀️|Sunny";
    if (code === 1) return "🌤️|Mostly Sunny";
    if (code === 2) return "⛅|Partly Cloudy";
    if (code === 3) return "☁️|Cloudy";
    if (code >= 45 && code <= 48) return "🌫️|Foggy";
    if (code >= 51 && code <= 67) return "🌧️|Rainy";
    if (code === 71 || code === 73 || code === 75 || code === 77) return "❄️|Snowy";
    if (code === 85 || code === 86) return "🌨️|Snow Showers";
    if (code >= 80 && code <= 82) return "🌧️|Rainy";
    if (code >= 95) return "⛈️|Thunderstorms";
    return "🌤️|Mostly Sunny";
  }

  function fetchCalendar(lat, lon) {
    var start = getNYCalendarDate(-3);
    var end = addDaysYmd(getNYCalendarDate(0), SEARCH_DAYS_AHEAD);
    var url = "https://www.hebcal.com/hebcal?v=1&cfg=json" +
      "&start=" + encodeURIComponent(start) + "&end=" + encodeURIComponent(end) +
      "&maj=on&ss=on&mvch=on&s=on&leyning=off" +
      "&c=on&i=off&geo=pos" +
      "&latitude=" + encodeURIComponent(lat) + "&longitude=" + encodeURIComponent(lon) +
      "&tzid=America%2FNew_York" +
      "&b=" + CANDLE_MINUTES_BEFORE_SUNSET +
      "&m=" + HAVDALAH_MINUTES_AFTER_SUNSET +
      "&lg=he-x-NoNikud";

    return fetch(url).then(function(r) {
      if (!r.ok) throw new Error("Hebcal returned status " + r.status);
      return r.json();
    });
  }

  function buildObservanceBlocks(items) {
    var timed = (items || []).filter(function(it) {
      return it.category === "candles" || it.category === "havdalah";
    }).slice().sort(function(a, b) {
      return new Date(a.date).getTime() - new Date(b.date).getTime();
    });

    var blocks = [];
    var current = null;

    for (var i = 0; i < timed.length; i++) {
      var it = timed[i];
      if (it.category === "candles") {
        if (!current) current = { candles: [], havdalah: null };
        current.candles.push(it);
      } else if (it.category === "havdalah" && current) {
        current.havdalah = it;
        blocks.push(current);
        current = null;
      }
    }

    if (current && current.candles.length) blocks.push(current);
    return blocks;
  }

  function selectNextOrCurrentBlock(items, preferredStartDate) {
    var blocks = buildObservanceBlocks(items);
    var now = Date.now();

    if (preferredStartDate) {
      for (var p = 0; p < blocks.length; p++) {
        if (dateFromIso(blocks[p].candles[0].date) === preferredStartDate) return blocks[p];
      }
    }

    for (var i = 0; i < blocks.length; i++) {
      var block = blocks[i];
      var endMs;
      if (block.havdalah && block.havdalah.date) {
        endMs = new Date(block.havdalah.date).getTime();
      } else {
        endMs = new Date(block.candles[block.candles.length - 1].date).getTime() + 36 * 60 * 60 * 1000;
      }
      if (endMs >= now) return block;
    }

    return null;
  }

  function observanceDatesFromBlock(block) {
    if (!block || !block.candles) return [];
    var out = [];
    for (var i = 0; i < block.candles.length; i++) {
      var candleDate = dateFromIso(block.candles[i].date);
      if (!candleDate) continue;
      var day = addDaysYmd(candleDate, 1);
      if (out.indexOf(day) === -1) out.push(day);
    }
    return out;
  }

  function normalizeYomTovName(name) {
    return String(name || "")
      .replace(/^ערב\s+/, "")
      .replace(/\s+\d+$/, "")
      .replace(/\s+[א-ת][׳״]?\s*$/, "")
      .trim();
  }

  function specialShabbatName(heb) {
    heb = String(heb || "");
    var map = [
      ["שבת נחמו", "נחמו"],
      ["שבת שובה", "שובה"],
      ["שבת שקלים", "שקלים"],
      ["שבת זכור", "זכור"],
      ["שבת פרה", "פרה"],
      ["שבת החודש", "החודש"],
      ["שבת הגדול", "הגדול"],
      ["שבת חזון", "חזון"],
      ["שבת ראש חודש", "ראש חודש"]
    ];
    for (var i = 0; i < map.length; i++) {
      if (heb.indexOf(map[i][0]) !== -1) return map[i][1];
    }
    return "";
  }

  function analyzeBlock(items, block) {
    var days = observanceDatesFromBlock(block);
    var firstDay = days[0] || addDaysYmd(dateFromIso(block.candles[0].date), 1);
    var finalDate = block.havdalah ? dateFromIso(block.havdalah.date) : (days[days.length - 1] || firstDay);

    var relevant = (items || []).filter(function(it) {
      var d = dateFromIso(it.date);
      return d && d >= firstDay && d <= finalDate;
    });

    var yomTovNames = [];
    var parsha = "";
    var additional = "";
    var finalDayIsYomTov = false;

    for (var i = 0; i < relevant.length; i++) {
      var it = relevant[i];
      if (it.category === "holiday" && it.yomtov) {
        var name = normalizeYomTovName(it.hebrew || it.title || "");
        if (name && yomTovNames.indexOf(name) === -1) yomTovNames.push(name);
        if (dateFromIso(it.date) === finalDate) finalDayIsYomTov = true;
      }
      if (!parsha && it.category === "parashat") {
        parsha = it.hebrew || String(it.title || "").replace(/^Parashat\s+/, "");
      }
    }

    var isYomTov = yomTovNames.length > 0;

    if (!isYomTov) {
      for (var j = 0; j < relevant.length; j++) {
        var rit = relevant[j];
        if (!additional && rit.category === "mevarchim") {
          var mh = rit.hebrew || "";
          var mm = mh.match(/חודש\s+(.+)$/);
          if (mm && mm[1]) additional = "מבה״ח " + mm[1].trim();
        }
        if (rit.category === "holiday") {
          var special = specialShabbatName(rit.hebrew || "");
          if (special) additional = special;
        }
      }
    }

    var title = isYomTov ? yomTovNames.join(" / ") : parsha;
    var endLabel;
    if (finalDayIsYomTov) {
      endLabel = "Motzei Yom Tov";
    } else if (dayNameFromYmd(finalDate) === "Shabbos") {
      endLabel = "Motzei Shabbos";
    } else {
      endLabel = isYomTov ? "Motzei Yom Tov" : "Motzei Shabbos";
    }

    return {
      isYomTov: isYomTov,
      title: title,
      parsha: parsha,
      yomTovName: isYomTov ? yomTovNames.join(" / ") : "",
      additional: additional,
      observanceDates: days,
      firstCandleDate: dateFromIso(block.candles[0].date),
      finalDate: finalDate,
      endLabel: endLabel,
      candleCount: block.candles.length
    };
  }

  function resetLocationFields(prefix) {
    var ids = [
      "high" + prefix, "low" + prefix,
      "high2" + prefix, "low2" + prefix,
      "high3" + prefix, "low3" + prefix,
      "candle" + prefix, "candle2" + prefix, "candle3" + prefix,
      "motzei" + prefix
    ];
    for (var i = 0; i < ids.length; i++) {
      var el = document.getElementById(ids[i]);
      if (el) el.value = "";
    }

    ["candle2" + prefix + "Wrap", "candle3" + prefix + "Wrap"].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.classList.add("hidden");
    });

    ["weather2" + prefix + "Wrap", "weather3" + prefix + "Wrap"].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.style.display = "none";
    });
  }

  function applyCalendar(data, prefix, preferredStartDate) {
    var items = data.items || [];
    var block = selectNextOrCurrentBlock(items, preferredStartDate);
    if (!block) throw new Error("No upcoming Shabbos or Yom Tov candle-lighting event was found.");

    resetLocationFields(prefix);
    window.__locationBlocks[prefix] = block;

    for (var i = 0; i < Math.min(block.candles.length, 3); i++) {
      var suffix = i === 0 ? "" : String(i + 1);
      var candleEl = document.getElementById("candle" + suffix + prefix);
      if (candleEl) candleEl.value = formatTimeFromIso(block.candles[i].date);
      if (i > 0) {
        var wrap = document.getElementById("candle" + suffix + prefix + "Wrap");
        if (wrap) wrap.classList.remove("hidden");
      }
    }

    if (block.havdalah) {
      document.getElementById("motzei" + prefix).value = formatTimeFromIso(block.havdalah.date);
    }

    if (prefix === "BK") {
      var info = analyzeBlock(items, block);
      window.__eventInfo = info;
      window.__isYomTov = info.isYomTov;
      window.__yomTovName = info.yomTovName;
      window.__candleDates = block.candles.map(function(c) { return c.date; });

      document.getElementById("parsha").value = info.title || "";
      document.getElementById("parshaFieldLabel").textContent = info.isYomTov ? "Yom Tov (Hebrew)" : "Parsha (Hebrew)";

      var additionalEl = document.getElementById("additionalText");
      var includeEl = document.getElementById("includeAdditional");
      if (info.additional) {
        additionalEl.value = info.additional;
        additionalEl.disabled = false;
        includeEl.checked = true;
      } else {
        additionalEl.value = "";
        additionalEl.disabled = true;
        includeEl.checked = false;
      }
    }

    var motzeiLabel = document.getElementById("motzeiLabel" + prefix);
    if (motzeiLabel) {
      if (prefix === "BK" && window.__eventInfo) {
        motzeiLabel.textContent = window.__eventInfo.endLabel;
      } else if (window.__eventInfo) {
        motzeiLabel.textContent = window.__eventInfo.endLabel;
      }
    }

    return block;
  }

  function fetchWeather(lat, lon) {
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + encodeURIComponent(lat) +
      "&longitude=" + encodeURIComponent(lon) +
      "&daily=apparent_temperature_max,apparent_temperature_min,weather_code" +
      "&past_days=3&forecast_days=14&temperature_unit=fahrenheit&timezone=America%2FNew_York";

    return fetch(url).then(function(r) {
      if (!r.ok) throw new Error("Weather returned status " + r.status);
      return r.json();
    });
  }

  function setWeatherDay(prefix, dayNumber, daily, idx) {
    var suffix = dayNumber === 1 ? "" : String(dayNumber);
    var hi = daily.apparent_temperature_max && daily.apparent_temperature_max[idx];
    var lo = daily.apparent_temperature_min && daily.apparent_temperature_min[idx];
    var wc = daily.weather_code && daily.weather_code[idx];

    if (hi != null) document.getElementById("high" + suffix + prefix).value = Math.round(hi);
    if (lo != null) document.getElementById("low" + suffix + prefix).value = Math.round(lo);
    if (wc != null) document.getElementById("emoji" + suffix + prefix).value = weatherEmoji(wc);
  }

  function applyWeather(wdata, prefix, block) {
    var daily = wdata.daily || {};
    var times = daily.time || [];
    var dates = observanceDatesFromBlock(block).slice(0, 3);

    for (var i = 0; i < dates.length; i++) {
      var idx = times.indexOf(dates[i]);
      if (idx !== -1) setWeatherDay(prefix, i + 1, daily, idx);
    }

    var day2Wrap = document.getElementById("weather2" + prefix + "Wrap");
    var day3Wrap = document.getElementById("weather3" + prefix + "Wrap");
    if (day2Wrap) day2Wrap.style.display = dates.length >= 2 ? "" : "none";
    if (day3Wrap) day3Wrap.style.display = dates.length >= 3 ? "" : "none";
  }

  function fetchLocation(prefix, zip, lat, lon, preferredStartDate) {
    return fetchCalendar(lat, lon)
      .then(function(data) {
        var block = applyCalendar(data, prefix, preferredStartDate);
        return fetchWeather(lat, lon)
          .then(function(wdata) {
            applyWeather(wdata, prefix, block);
            return { ok: true, block: block, warnings: [] };
          })
          .catch(function(err) {
            return { ok: true, block: block, warnings: ["Weather failed for " + prefix + ": " + err.message] };
          });
      })
      .catch(function(err) {
        return { ok: false, error: err.message, warnings: [] };
      });
  }

  function formatShortDate(ymd) {
    if (!ymd) return "";
    var p = ymd.split("-");
    var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10), 12, 0, 0);
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }

  function loadedStatus(extraWarnings) {
    var info = window.__eventInfo;
    if (!info) return "Done. Review anything that looks off.";

    var range = formatShortDate(info.firstCandleDate);
    if (info.finalDate && info.finalDate !== info.firstCandleDate) range += " - " + formatShortDate(info.finalDate);

    var msg = "Loaded " + (info.title || "next event") + " • " + range +
      " • Zmanim: " + CANDLE_MINUTES_BEFORE_SUNSET + " min before sunset / " + HAVDALAH_MINUTES_AFTER_SUNSET + " min after sunset";

    if (extraWarnings && extraWarnings.length) msg += " • ⚠️ " + extraWarnings.join("; ");
    return msg;
  }

  function fetchAll() {
    if (location.protocol === "file:") {
      setStatus("⚠️ This file is open as a local file (file://). Most browsers block live API requests from local files. Host index.html online for auto-fetch to work. Manual entry still works.");
      return;
    }

    setStatus("Finding the next Shabbos or Yom Tov...");
    window.__eventInfo = null;
    window.__locationBlocks = {};

    fetchLocation("BK", LOCATIONS.BK.zip, LOCATIONS.BK.lat, LOCATIONS.BK.lon, null)
      .then(function(bkResult) {
        if (!bkResult.ok) {
          setStatus("⚠️ Brooklyn fetch failed: " + bkResult.error + ". Fill in manually.");
          updatePreview();
          return null;
        }

        var warnings = bkResult.warnings.slice();
        updatePreview();

        if (!document.getElementById("addMonticello").checked) {
          setStatus(loadedStatus(warnings));
          return null;
        }

        setStatus("Brooklyn loaded. Fetching Monticello for the same event...");
        var preferred = window.__eventInfo ? window.__eventInfo.firstCandleDate : null;
        return fetchLocation("MC", LOCATIONS.MC.zip, LOCATIONS.MC.lat, LOCATIONS.MC.lon, preferred)
          .then(function(mcResult) {
            if (!mcResult.ok) {
              warnings.push("Monticello failed: " + mcResult.error);
            } else {
              warnings = warnings.concat(mcResult.warnings);
            }
            updatePreview();
            setStatus(loadedStatus(warnings));
          });
      });
  }

  function escapeHtml(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  var YOM_TOV_EMOJIS = {
    "ראש השנה": "🍎",
    "יום כיפור": "🤍",
    "סוכות": "🌿",
    "שמיני עצרת": "📜",
    "שמחת תורה": "🎉",
    "פסח": "🍷",
    "שבועות": "🌸"
  };

  function getYomTovEmoji(name) {
    if (!name) return "🌟";
    for (var key in YOM_TOV_EMOJIS) {
      if (name.indexOf(key) !== -1) return YOM_TOV_EMOJIS[key];
    }
    return "🌟";
  }

  function weatherLine(prefix, dayNumber, locationName, dayName, showDayName) {
    var suffix = dayNumber === 1 ? "" : String(dayNumber);
    var high = document.getElementById("high" + suffix + prefix).value || "__";
    var low = document.getElementById("low" + suffix + prefix).value || "__";
    var emojiVal = document.getElementById("emoji" + suffix + prefix).value || "🌤️|Mostly Sunny";
    var parts = emojiVal.split("|");
    var emoji = parts[0];
    var condition = parts[1] || "";
    var dayPart = showDayName && dayName ? " - " + dayName : "";

    return "\n" + emoji + " *Weather (" + locationName + dayPart + "):*\n" +
      condition + "; Feel: High " + high + "°  Low " + low + "°\n";
  }

  function updatePreview() {
    var info = window.__eventInfo || {
      isYomTov: false,
      yomTovName: "",
      observanceDates: [],
      endLabel: "Motzei Shabbos",
      candleCount: 1
    };

    var parsha = document.getElementById("parsha").value || "____";
    var additionalText = document.getElementById("additionalText").value;
    var addMonticello = document.getElementById("addMonticello").checked;
    var quote = document.getElementById("quote").value || "____";

    var parshaLine = parsha;
    if (document.getElementById("includeAdditional").checked && additionalText) {
      parshaLine += " - " + additionalText;
    }

    var headerText = info.isYomTov ? "A Git Yom Tov" : "A Git Shabbos";
    var headerEmoji = info.isYomTov ? getYomTovEmoji(info.yomTovName) : (window.__flower || "🌼");
    var parshaLabel = info.isYomTov ? "Yom Tov" : "Parsha";

    var dates = info.observanceDates || [];
    var dayCount = Math.max(1, Math.min(3, dates.length || info.candleCount || 1));
    var showDayName = info.isYomTov || dayCount > 1;

    document.getElementById("weather2BKWrap").style.display = dayCount >= 2 ? "" : "none";
    document.getElementById("weather3BKWrap").style.display = dayCount >= 3 ? "" : "none";
    document.getElementById("weather2MCWrap").style.display = (addMonticello && dayCount >= 2) ? "" : "none";
    document.getElementById("weather3MCWrap").style.display = (addMonticello && dayCount >= 3) ? "" : "none";

    var raw =
      "〰️〰️〰️〰️〰️〰️〰️〰️〰️〰️〰️\n" +
      "         *" + headerEmoji + " " + headerText + " " + headerEmoji + "*\n" +
      "〰️〰️〰️〰️〰️〰️〰️〰️〰️〰️〰️\n\n" +
      "📜 *" + parshaLabel + ": " + parshaLine + "*\n";

    for (var d = 1; d <= dayCount; d++) {
      raw += weatherLine("BK", d, "Brooklyn", dayNameFromYmd(dates[d - 1] || ""), showDayName);
    }

    if (addMonticello) {
      for (var md = 1; md <= dayCount; md++) {
        raw += weatherLine("MC", md, "Monticello", dayNameFromYmd(dates[md - 1] || ""), showDayName);
      }
    }

    var candleBK = document.getElementById("candleBK").value || "__:__";
    var candle2BK = document.getElementById("candle2BK").value;
    var candle3BK = document.getElementById("candle3BK").value;
    var motzeiBK = document.getElementById("motzeiBK").value || "__:__";

    raw += "\n🕰 *Zmanim (Brooklyn):*\n" +
      "• Candle lighting: " + candleBK + "  \n";
    if (dayCount >= 2 && candle2BK) raw += "• Candle lighting 2nd night: " + candle2BK + "  \n";
    if (dayCount >= 3 && candle3BK) raw += "• Candle lighting 3rd night: " + candle3BK + "  \n";
    raw += "• " + (info.endLabel || "Motzei Shabbos") + ": " + motzeiBK + "  \n";

    if (addMonticello) {
      var candleMC = document.getElementById("candleMC").value || "__:__";
      var candle2MC = document.getElementById("candle2MC").value;
      var candle3MC = document.getElementById("candle3MC").value;
      var motzeiMC = document.getElementById("motzeiMC").value || "__:__";

      raw += "\n🕰 *Zmanim (Monticello):*\n" +
        "• Candle lighting: " + candleMC + "  \n";
      if (dayCount >= 2 && candle2MC) raw += "• Candle lighting 2nd night: " + candle2MC + "  \n";
      if (dayCount >= 3 && candle3MC) raw += "• Candle lighting 3rd night: " + candle3MC + "  \n";
      raw += "• " + (info.endLabel || "Motzei Shabbos") + ": " + motzeiMC + "  \n";
    }

    raw += "\n💬 *Quote:*\n> " + quote;
    window.__rawMessage = raw;

    var html = escapeHtml(raw);
    html = html.replace(/\*(.+?)\*/g, "<b>$1</b>");
    html = html.replace(/^&gt; (.*)$/gm, '<span class="quoteline">$1</span>');
    document.getElementById("preview").innerHTML = html;
  }

  function copyMessage() {
    var text = window.__rawMessage || "";
    var copiedMsg = document.getElementById("copiedMsg");

    function showCopied() {
      copiedMsg.textContent = "✅ Copied! Paste into WhatsApp.";
      setTimeout(function() { copiedMsg.textContent = ""; }, 2500);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showCopied, function() {
        fallbackCopy(text, showCopied);
      });
    } else {
      fallbackCopy(text, showCopied);
    }
  }

  function fallbackCopy(text, cb) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    if (cb) cb();
  }

  function shuffleQuote() {
    var current = document.getElementById("quote").value;
    document.getElementById("quote").value = getRandomQuoteText(current);
    updatePreview();
  }

  document.addEventListener("DOMContentLoaded", function() {
    window.__flower = FLOWERS[Math.floor(Math.random() * FLOWERS.length)];
    document.getElementById("footer").textContent = "A Davidowitz Project © " + new Date().getFullYear() + " • v" + APP_VERSION;
    document.getElementById("quote").value = quotes[Math.floor(Math.random() * quotes.length)];

    fetchQuotes().then(function() {
      document.getElementById("quote").value = getRandomQuoteText();
      updatePreview();
    });

    var textFields = [
      "parsha", "additionalText",
      "highBK", "lowBK", "high2BK", "low2BK", "high3BK", "low3BK",
      "highMC", "lowMC", "high2MC", "low2MC", "high3MC", "low3MC",
      "candleBK", "candle2BK", "candle3BK", "motzeiBK",
      "candleMC", "candle2MC", "candle3MC", "motzeiMC",
      "quote", "emojiBK", "emoji2BK", "emoji3BK", "emojiMC", "emoji2MC", "emoji3MC"
    ];

    for (var i = 0; i < textFields.length; i++) {
      document.getElementById(textFields[i]).addEventListener("input", updatePreview);
      document.getElementById(textFields[i]).addEventListener("change", updatePreview);
    }

    document.getElementById("includeAdditional").addEventListener("change", function() {
      document.getElementById("additionalText").disabled = !this.checked;
      updatePreview();
    });

    document.getElementById("addMonticello").addEventListener("change", function() {
      var section = document.getElementById("monticelloSection");
      if (this.checked) {
        section.classList.remove("hidden");
      } else {
        section.classList.add("hidden");
      }
      updatePreview();

      if (this.checked && location.protocol !== "file:") {
        var hasData = document.getElementById("candleMC").value;
        if (!hasData) {
          setStatus("Fetching Monticello for the same event...");
          var preferred = window.__eventInfo ? window.__eventInfo.firstCandleDate : null;
          fetchLocation("MC", LOCATIONS.MC.zip, LOCATIONS.MC.lat, LOCATIONS.MC.lon, preferred).then(function(result) {
            if (!result.ok) {
              setStatus("⚠️ Monticello fetch failed: " + result.error + ". Fill it in manually.");
            } else {
              updatePreview();
              setStatus(loadedStatus(result.warnings));
            }
          });
        }
      }
    });

    document.getElementById("fetchBtn").addEventListener("click", fetchAll);
    document.getElementById("shuffleBtn").addEventListener("click", shuffleQuote);
    document.getElementById("copyBtn").addEventListener("click", copyMessage);

    updatePreview();
    fetchAll();
  });
</script>
