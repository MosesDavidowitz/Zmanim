<!DOCTYPE html>

<style>
  * { box-sizing: border-box; }

  .row { display: flex; gap: 10px; }

  .header-banner {

    border-radius: 10px;

  .header-banner h1 {

    font-size: 26px;

  .checkbox-row {

<script>
  var quotes = [
    "Common sense is like deodorant. The people who need it most never seem to use it.",
    "A smooth sea never made a skilled sailor.",
    "The best time to plant a tree was 20 years ago. The second best time is now.",
    "Worry never robs tomorrow of its sorrow, it only saps today of its joy.",
    "You can't control the wind, but you can adjust your sails.",
    "Difficult roads often lead to beautiful destinations.",
    "A little progress each day adds up to big results.",
    "Gratitude turns what we have into enough.",
    "The smallest act of kindness is worth more than the grandest intention.",
    "Patience is not the ability to wait, but the ability to keep a good attitude while waiting.",
    "What lies behind us and what lies before us are tiny matters compared to what lies within us.",
    "Comparison is the thief of joy.",
    "Be the reason someone smiles today.",
    "Out of difficulties grow miracles.",
    "Every accomplishment starts with the decision to try.",
    "The way to get started is to quit talking and begin doing.",
    "Happiness is not by chance, but by choice.",
    "Don't watch the clock; do what it does. Keep going.",
    "Tough times never last, but tough people do.",
    "A grateful heart is a magnet for miracles.",
    "Kindness is a language the deaf can hear and the blind can see.",
    "It always seems impossible until it's done.",
    "The greatest glory in living lies not in never falling, but in rising every time we fall.",
    "Believe you can and you're halfway there.",
    "Small deeds done are better than great deeds planned.",
    "Hope is being able to see that there is light despite all of the darkness.",
    "Wherever you go, go with all your heart.",
    "Peace begins with a smile.",
    "We rise by lifting others.",
    "Every sunset brings the promise of a new dawn."
  ];

  // Brooklyn (zip 11219) and Monticello (zip 12701) coordinates
  var LOCATIONS = {
    BK: { lat: 40.6304, lon: -73.9980, zip: "11219" },
    MC: { lat: 41.6560, lon: -74.6904, zip: "12701" }
  };

  var FLOWERS = ["🌼", "🌸", "🌺", "🌻", "🌷", "🌹", "🪷", "🌝"];

  var remoteQuotes = [];

  function fetchQuotes() {
    if (location.protocol === "file:") return Promise.resolve();
    return fetch("https://quoteslate.vercel.app/api/quotes/random?count=50&maxLength=160")
      .then(function(r) {
        if (!r.ok) throw new Error("QuoteSlate status " + r.status);
        return r.json();
      })
      .then(function(data) {
        remoteQuotes = data
          .map(function(q) { return { text: q.quote }; })
          .filter(function(q) { return q.text && q.text.length > 10 && q.text.length < 180; });
      })
      .catch(function(err) {
        return fetch("https://type.fit/api/quotes")
          .then(function(r) {
            if (!r.ok) throw new Error("type.fit status " + r.status);
            return r.json();
          })
          .then(function(data) {
            remoteQuotes = data.filter(function(q) {
              return q && q.text && q.text.length > 10 && q.text.length < 180;
            });
          })
          .catch(function(err2) {
            // silently fall back to the local quote list
          });
      });
  }

  function getRandomQuoteText(excludeText) {
    var pool = remoteQuotes.length > 0 ? remoteQuotes : null;
    if (pool) {
      var attempts = 0;
      var text;
      do {
        var q = pool[Math.floor(Math.random() * pool.length)];
        text = q.text.replace(/[\s-]+$/, "").trim();
        attempts++;
      } while (text === excludeText && attempts < 10);
      return text;
    }
    var next = excludeText;
    var tries = 0;
    while (next === excludeText && tries < 10) {
      next = quotes[Math.floor(Math.random() * quotes.length)];
      tries++;
    }
    return next;
  }

  function pad(n) { return n < 10 ? "0" + n : n; }

  function getTomorrowDateStr() {
    var nyNowStr = new Date().toLocaleString("en-US", { timeZone: "America/New_York" });
    var nyDate = new Date(nyNowStr);
    nyDate.setDate(nyDate.getDate() + 1);
    return nyDate.getFullYear() + "-" + pad(nyDate.getMonth() + 1) + "-" + pad(nyDate.getDate());
  }

  function formatTimeFromIso(iso) {
    var m = iso.match(/T(\d{2}):(\d{2})/);
    if (!m) return "";
    var h = parseInt(m[1], 10);
    var min = m[2];
    var h12 = h % 12;
    if (h12 === 0) h12 = 12;
    return h12 + ":" + min;
  }

  function dateFromIso(iso) {
    var m = iso.match(/^(\d{4}-\d{2}-\d{2})/);
    return m ? m[1] : "";
  }

  function setStatus(msg) {
    document.getElementById("status").textContent = msg;
  }

  // WMO weather code -> emoji
  function weatherEmoji(code) {
    if (code === 0) return "☀️|Sunny";
    if (code === 1 || code === 2) return "🌤️|Mostly Sunny";
    if (code === 3) return "☁️|Cloudy";
    if (code >= 45 && code <= 48) return "🌫️|Foggy";
    if (code >= 51 && code <= 67) return "🌧️|Rainy";
    if (code === 71 || code === 73 || code === 75 || code === 77) return "❄️|Snowy";
    if (code === 85 || code === 86) return "🌨️|Snow Showers";
    if (code >= 80 && code <= 82) return "🌧️|Rainy";
    if (code >= 95) return "⛈️|Thunderstorms";
    return "🌤️|Mostly Sunny";
  }

  function fetchZmanimForDate(zip, date) {
    var url = "https://www.hebcal.com/shabbat?cfg=json&zip=" + zip + "&m=72&b=22&lg=he&mvch=on&d=on&dt=" + date;
    return fetch(url).then(function(r) {
      if (!r.ok) throw new Error("Hebcal returned status " + r.status);
      return r.json();
    });
  }

  function getNextShabbatDateStr() {
    var now = new Date(new Date().toLocaleString("en-US", { timeZone: "America/New_York" }));
    var day = now.getDay();
    var daysToSat = (6 - day + 7) % 7;
    if (daysToSat === 0 && now.getHours() >= 20) daysToSat = 7;
    var sat = new Date(now);
    sat.setDate(now.getDate() + daysToSat);
    return sat.getFullYear() + "-" + pad(sat.getMonth() + 1) + "-" + pad(sat.getDate());
  }

  function fetchZmanim(zip) {
    var satDate = getNextShabbatDateStr();
    // Parse Saturday date to compute Sunday
    var parts = satDate.split("-");
    var sat = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    var sun = new Date(sat); sun.setDate(sat.getDate() + 1);
    var sunDate = sun.getFullYear() + "-" + pad(sun.getMonth() + 1) + "-" + pad(sun.getDate());

    // Fetch Shabbat/Yom Tov week, then also fetch Sunday to catch 2-day Yom Tov havdalah
    return Promise.all([
      fetchZmanimForDate(zip, satDate),
      fetchZmanimForDate(zip, sunDate)
    ]).then(function(results) {
      // Merge items from both responses, deduplicating by date+category
      var seen = {};
      var merged = { items: [] };
      [results[0], results[1]].forEach(function(data) {
        (data.items || []).forEach(function(it) {
          var key = it.category + "|" + it.date;
          if (!seen[key]) {
            seen[key] = true;
            merged.items.push(it);
          }
        });
      });
      return merged;
    });
  }

  function fetchWeather(lat, lon) {
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
      "&daily=apparent_temperature_max,apparent_temperature_min&hourly=weathercode&forecast_days=3&temperature_unit=fahrenheit&timezone=America%2FNew_York";
    return fetch(url).then(function(r) {
      if (!r.ok) throw new Error("Weather returned status " + r.status);
      return r.json();
    });
  }

  function applyZmanim(data, prefix) {
    var items = data.items || [];
    var candles = [], candleDates = [], havdalah = "", havdalahDate = "", parsha = "", yomTovName = "";
    var isYomTov = false;

    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.category === "candles") {
        candles.push(formatTimeFromIso(it.date));
        candleDates.push(it.date); // keep ISO date for day-name lookup
      } else if (it.category === "havdalah") {
        // Only accept havdalah within 3 days of the first candle lighting
        // to prevent the next Shabbos's havdalah from being picked up
        var havdalahIsoDate = dateFromIso(it.date);
        if (candles.length === 0) {
          // No candles yet, accept tentatively
          havdalah = formatTimeFromIso(it.date);
          havdalahDate = havdalahIsoDate;
        } else {
          var firstCandleDate = new Date(candleDates[0].substring(0, 10));
          var hDate = new Date(havdalahIsoDate);
          var diffDays = (hDate - firstCandleDate) / (1000 * 60 * 60 * 24);
          if (diffDays >= 0 && diffDays <= 4) {
            havdalah = formatTimeFromIso(it.date);
            havdalahDate = havdalahIsoDate;
          }
        }
      } else if (it.category === "parashat" && prefix === "BK") {
        parsha = it.hebrew || it.title.replace(/^Parashat\s+/, "");
      } else if (it.category === "mevarchim" && prefix === "BK") {
        var monthMatch = (it.hebrew || "").match(/חודש\s+(.+)$/);
        var monthName = monthMatch ? monthMatch[1] : "";
        var additionalEl = document.getElementById("additionalText");
        additionalEl.value = "מבה\u05f4ח " + monthName;
        additionalEl.disabled = false;
        document.getElementById("includeAdditional").checked = true;
      } else if (it.category === "holiday" && prefix === "BK") {
        var heb = it.hebrew || "";
        // Detect real Yom Tov (not Erev)
        if (it.yomtov && heb.indexOf("\u05e2\u05e8\u05d1") === -1) {
          isYomTov = true;
        }
        var specialShabbat = null;
        if (heb.indexOf("\u05e9\u05d1\u05ea \u05e0\u05d7\u05de\u05d5") !== -1) specialShabbat = "\u05e0\u05d7\u05de\u05d5";
        else if (heb.indexOf("\u05e9\u05d1\u05ea \u05e9\u05d5\u05d1\u05d4") !== -1) specialShabbat = "\u05e9\u05d5\u05d1\u05d4";
        else if (heb.indexOf("\u05e9\u05d1\u05ea \u05e9\u05e7\u05dc\u05d9\u05dd") !== -1) specialShabbat = "\u05e9\u05e7\u05dc\u05d9\u05dd";
        else if (heb.indexOf("\u05e9\u05d1\u05ea \u05d6\u05db\u05d5\u05e8") !== -1) specialShabbat = "\u05d6\u05db\u05d5\u05e8";
        else if (heb.indexOf("\u05e9\u05d1\u05ea \u05e4\u05e8\u05d4") !== -1) specialShabbat = "\u05e4\u05e8\u05d4";
        else if (heb.indexOf("\u05e9\u05d1\u05ea \u05d4\u05d7\u05d5\u05d3\u05e9") !== -1) specialShabbat = "\u05d4\u05d7\u05d5\u05d3\u05e9";
        else if (heb.indexOf("\u05e9\u05d1\u05ea \u05d4\u05d2\u05d3\u05d5\u05dc") !== -1) specialShabbat = "\u05d4\u05d2\u05d3\u05d5\u05dc";
        else if (heb.indexOf("\u05e9\u05d1\u05ea \u05d7\u05d6\u05d5\u05df") !== -1) specialShabbat = "\u05d7\u05d6\u05d5\u05df";
        else if (heb.indexOf("\u05e9\u05d1\u05ea \u05e8\u05d0\u05e9") !== -1) specialShabbat = "\u05e8\u05d0\u05e9 \u05d7\u05d5\u05d3\u05e9";
        if (specialShabbat) {
          var el = document.getElementById("additionalText");
          el.value = specialShabbat;
          el.disabled = false;
          document.getElementById("includeAdditional").checked = true;
        }
        if (!yomTovName && !specialShabbat && heb.indexOf("\u05e2\u05e8\u05d1") === -1) {
          yomTovName = heb
            .replace(/\s+\d+$/, "")
            .replace(/\s+[א-ת][\u05f3\u05f4]\s*$/, "")
            .replace(/\s+[א-ת]\s*$/, "")
            .trim();
        }
      }
    }

    // For BK, store global state for header/label rendering
    if (prefix === "BK") {
      window.__isYomTov = isYomTov;
      window.__yomTovName = yomTovName;
      window.__candleDates = candleDates;
    }

    if (candles.length >= 1) document.getElementById("candle" + prefix).value = candles[0];

    var isTwoDayYomTov = candles.length >= 2;
    var candle2Wrap = document.getElementById("candle2" + prefix + "Wrap");
    var motzeiLabel = document.getElementById("motzeiLabel" + prefix);

    if (isTwoDayYomTov) {
      document.getElementById("candle2" + prefix).value = candles[1];
      candle2Wrap.classList.remove("hidden");
      if (motzeiLabel) motzeiLabel.textContent = "Motzei Yom Tov";
      if (!havdalah && candles.length >= 3) havdalah = candles[2];
    } else {
      candle2Wrap.classList.add("hidden");
      if (motzeiLabel) motzeiLabel.textContent = isYomTov ? "Motzei Yom Tov" : "Motzei Shabbos";
    }

    if (havdalah) document.getElementById("motzei" + prefix).value = havdalah;

    if (prefix === "BK") {
      if (isYomTov && yomTovName) {
        document.getElementById("parsha").value = yomTovName;
      } else if (parsha) {
        document.getElementById("parsha").value = parsha;
      } else if (yomTovName) {
        document.getElementById("parsha").value = yomTovName;
      }
    }

    return havdalahDate;
  }

  function fetchWeather(lat, lon) {
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
      "&daily=apparent_temperature_max,apparent_temperature_min,sunset&hourly=weathercode&forecast_days=8&temperature_unit=fahrenheit&timezone=America%2FNew_York";
    return fetch(url).then(function(r) {
      if (!r.ok) throw new Error("Weather returned status " + r.status);
      return r.json();
    });
  }

  function applyWeather(wdata, prefix) {
    var daily = wdata.daily;
    if (!daily || !daily.apparent_temperature_max) return;

    // Get the candle dates from Hebcal to find correct day indices in Open-Meteo
    var candleDates = window.__candleDates || [];
    var times = daily.time || [];

    function getIdx(isoDate) {
      if (!isoDate) return -1;
      var d = isoDate.substring(0, 10); // "YYYY-MM-DD"
      var idx = times.indexOf(d);
      return idx !== -1 ? idx : -1;
    }

    // Day 1 = erev candle date (the day candle lighting falls on)
    // Day 2 = next day (second day of Yom Tov)
    var candleDate1 = candleDates[0] ? candleDates[0].substring(0, 10) : "";
    var candleDate2 = candleDates[1] ? candleDates[1].substring(0, 10) : "";

    var idx1 = getIdx(candleDate1);
    if (idx1 === -1) idx1 = 1; // fallback: tomorrow

    // For the Yom Tov day itself (Shabbos), it's the day AFTER erev candle lighting
    var ytIdx1 = idx1 + 1 < daily.apparent_temperature_max.length ? idx1 + 1 : idx1;
    var ytIdx2 = candleDate2 ? (getIdx(candleDate2) !== -1 ? getIdx(candleDate2) + 1 : ytIdx1 + 1) : ytIdx1 + 1;
    if (ytIdx2 >= daily.apparent_temperature_max.length) ytIdx2 = ytIdx1;

    var hi1 = Math.round(daily.apparent_temperature_max[ytIdx1] || 0);
    var lo1 = Math.round(daily.apparent_temperature_min[ytIdx1] || 0);
    var hi2 = Math.round(daily.apparent_temperature_max[ytIdx2] || hi1);
    var lo2 = Math.round(daily.apparent_temperature_min[ytIdx2] || lo1);

    document.getElementById("high" + prefix).value = hi1;
    document.getElementById("low" + prefix).value = lo1;
    document.getElementById("high2" + prefix).value = hi2;
    document.getElementById("low2" + prefix).value = lo2;

    // Weathercode at noon of each Yom Tov day (hour = ytIdx * 24 + 12)
    var wc = (wdata.hourly && wdata.hourly.weathercode) ? wdata.hourly.weathercode : [];
    var code1 = wc[ytIdx1 * 24 + 12] != null ? wc[ytIdx1 * 24 + 12] : wc[wc.length - 1];
    var code2 = wc[ytIdx2 * 24 + 12] != null ? wc[ytIdx2 * 24 + 12] : code1;
    document.getElementById("emoji" + prefix).value = weatherEmoji(code1);
    document.getElementById("emoji2" + prefix).value = weatherEmoji(code2);

    // Candle lighting = sunset on erev (idx1) minus 22 minutes
    if (daily.sunset && daily.sunset[idx1]) {
      var sm = daily.sunset[idx1].match(/T(\d{2}):(\d{2})/);
      if (sm) {
        var totalMin = parseInt(sm[1], 10) * 60 + parseInt(sm[2], 10) - 22;
        var clH = Math.floor(totalMin / 60);
        var clM = totalMin % 60;
        var h12 = clH % 12; if (h12 === 0) h12 = 12;
        document.getElementById("candle" + prefix).value = h12 + ":" + (clM < 10 ? "0" : "") + clM;
      }
    }

    // 2nd night candle lighting = sunset on erev day 2 (idx for candleDate2) minus 22 min
    var idx2erev = candleDate2 ? getIdx(candleDate2) : -1;
    if (idx2erev !== -1 && daily.sunset && daily.sunset[idx2erev]) {
      var sm2 = daily.sunset[idx2erev].match(/T(\d{2}):(\d{2})/);
      if (sm2) {
        var totalMin2 = parseInt(sm2[1], 10) * 60 + parseInt(sm2[2], 10);
        // 2nd night: can light from existing flame once stars out = no offset, just after sunset
        // but Tomche Shabbos shows same -0 or tzeit. Use sunset time directly (motzei = sunset + 72)
        // Actually 2nd night candle lighting is shown as a separate "candle lighting" event by Hebcal
        // which we already have from applyZmanim - so leave that field as-is, don't override
      }
    }
  }

  function fetchLocation(prefix, zip, lat, lon) {
    return fetchZmanim(zip)
      .then(function(data) {
        applyZmanim(data, prefix);
      })
      .catch(function(err) {
        setStatus("⚠️ Zmanim fetch failed (" + prefix + "): " + err.message + ". Fill in manually.");
      })
      .then(function() {
        return fetchWeather(lat, lon)
          .then(function(wdata) {
            applyWeather(wdata, prefix);
          })
          .catch(function(err) {
            setStatus("⚠️ Weather fetch failed (" + prefix + "): " + err.message + ". Fill in manually.");
          });
      });
  }

  function fetchAll() {
    if (location.protocol === "file:") {
      setStatus("⚠️ This file is open as a local file (file://). Most browsers block live data fetches from local files. Host this file online (e.g. GitHub Pages) for auto-fetch to work. You can still fill everything in manually below.");
      return;
    }

    setStatus("Fetching Brooklyn zmanim, parsha & weather...");

    var tasks = [fetchLocation("BK", LOCATIONS.BK.zip, LOCATIONS.BK.lat, LOCATIONS.BK.lon)];

    if (document.getElementById("addMonticello").checked) {
      tasks.push(fetchLocation("MC", LOCATIONS.MC.zip, LOCATIONS.MC.lat, LOCATIONS.MC.lon));
    }

    Promise.all(tasks).then(function() {
      setStatus("Done! Review and edit anything that looks off.");
      updatePreview();
    });
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  var DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Shabbos"];

  function dayNameFromIso(iso) {
    if (!iso) return "";
    var m = iso.match(/^(\d{4}-\d{2}-\d{2})/);
    if (!m) return "";
    var parts = m[1].split("-");
    var d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    return DAY_NAMES[d.getDay()];
  }

  // Yom Tov emojis — same emoji both sides (never ✡)
  var YOM_TOV_EMOJIS = {
    "\u05e8\u05d0\u05e9 \u05d4\u05e9\u05e0\u05d4": "🍎",   // ראש השנה
    "\u05d9\u05d5\u05dd \u05db\u05d9\u05e4\u05d5\u05e8": "🤍",  // יום כיפור
    "\u05e1\u05d5\u05db\u05d5\u05ea": "🌿",                  // סוכות
    "\u05e9\u05de\u05d9\u05e0\u05d9 \u05e2\u05e6\u05e8\u05ea": "📜", // שמיני עצרת
    "\u05e9\u05de\u05d7\u05ea \u05ea\u05d5\u05e8\u05d4": "🎉",  // שמחת תורה
    "\u05e4\u05e1\u05d7": "🍷",                               // פסח
    "\u05e9\u05d1\u05d5\u05e2\u05d5\u05ea": "🌸",            // שבועות
  };

  function getYomTovEmoji(name) {
    if (!name) return "🌟";
    for (var key in YOM_TOV_EMOJIS) {
      if (name.indexOf(key) !== -1) return YOM_TOV_EMOJIS[key];
    }
    return "🌟";
  }

  function updatePreview() {
    var parsha = document.getElementById("parsha").value || "____";
    var additionalText = document.getElementById("additionalText").value;
    var isYomTov = window.__isYomTov || false;
    var yomTovName = window.__yomTovName || "";
    var candleDates = window.__candleDates || [];

    var isTwoDayBK = !document.getElementById("candle2BKWrap").classList.contains("hidden");
    var isTwoDayMC = !document.getElementById("candle2MCWrap").classList.contains("hidden");

    // Show/hide day-2 weather rows
    document.getElementById("weather2BKWrap").style.display = isTwoDayBK ? "" : "none";
    document.getElementById("weather2MCWrap").style.display = (isTwoDayMC && document.getElementById("addMonticello").checked) ? "" : "none";

    // Day 1 weather
    var highBK = document.getElementById("highBK").value || "__";
    var lowBK = document.getElementById("lowBK").value || "__";
    var emojiValBK = document.getElementById("emojiBK").value || "🌤️|Mostly Sunny";
    var partsB1 = emojiValBK.split("|");
    var emojiBK = partsB1[0]; var conditionBK = partsB1[1] || "";

    // Day 2 weather
    var high2BK = document.getElementById("high2BK").value || highBK;
    var low2BK = document.getElementById("low2BK").value || lowBK;
    var emojiVal2BK = document.getElementById("emoji2BK").value || emojiValBK;
    var partsB2 = emojiVal2BK.split("|");
    var emoji2BK = partsB2[0]; var condition2BK = partsB2[1] || conditionBK;

    var addMonticello = document.getElementById("addMonticello").checked;
    var highMC = document.getElementById("highMC").value || "__";
    var lowMC = document.getElementById("lowMC").value || "__";
    var emojiValMC = document.getElementById("emojiMC").value || "🌤️|Mostly Sunny";
    var partsMC1 = emojiValMC.split("|");
    var emojiMC = partsMC1[0]; var conditionMC = partsMC1[1] || "";

    var high2MC = document.getElementById("high2MC").value || highMC;
    var low2MC = document.getElementById("low2MC").value || lowMC;
    var emojiVal2MC = document.getElementById("emoji2MC").value || emojiValMC;
    var partsMC2 = emojiVal2MC.split("|");
    var emoji2MC = partsMC2[0]; var condition2MC = partsMC2[1] || conditionMC;

    var candleBK = document.getElementById("candleBK").value || "__:__";
    var candle2BK = document.getElementById("candle2BK").value;
    var motzeiBK = document.getElementById("motzeiBK").value || "__:__";
    var motzeiLabelBK = (isTwoDayBK || isYomTov) ? "Motzei Yom Tov" : "Motzei Shabbos";

    var candleMC = document.getElementById("candleMC").value || "__:__";
    var candle2MC = document.getElementById("candle2MC").value;
    var motzeiMC = document.getElementById("motzeiMC").value || "__:__";
    var motzeiLabelMC = (isTwoDayMC || isYomTov) ? "Motzei Yom Tov" : "Motzei Shabbos";

    var quote = document.getElementById("quote").value || "____";

    var parshaLine = parsha;
    if (document.getElementById("includeAdditional").checked && additionalText) {
      parshaLine += " - " + additionalText;
    }

    // Header emoji — same on both sides
    var headerText, headerEmoji;
    if (isYomTov) {
      headerText = "A Git Yom Tov";
      headerEmoji = getYomTovEmoji(yomTovName);
    } else {
      headerText = "A Git Shabbos";
      headerEmoji = window.__flower || "🌼";
    }

    // Parsha/Yom Tov label — always English
    var parshaLabel = isYomTov ? "Yom Tov" : "Parsha";

    // Day names for 2-day Yom Tov weather labels
    function nextDay(iso) {
      if (!iso) return "";
      var m = iso.match(/^(\d{4}-\d{2}-\d{2})/);
      if (!m) return "";
      var parts = m[1].split("-");
      var d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      d.setDate(d.getDate() + 1); // candle date is Erev, so +1 = actual Yom Tov day
      return DAY_NAMES[d.getDay()];
    }
    var ytDay1 = nextDay(candleDates[0] || "");
    var ytDay2 = nextDay(candleDates[1] || "");

    var raw =
"〰️〰️〰️〰️〰️〰️〰️〰️〰️〰️〰️\n" +
"         *" + headerEmoji + " " + headerText + " " + headerEmoji + "*\n" +
"〰️〰️〰️〰️〰️〰️〰️〰️〰️〰️〰️\n\n" +
"📜 *" + parshaLabel + ": " + parshaLine + "*\n";

    // Weather
    if (isTwoDayBK && ytDay1 && ytDay2) {
      raw += "\n" + emojiBK + " *Weather (Brooklyn - " + ytDay1 + "):*\n" +
conditionBK + "; Feel: High " + highBK + "°  Low " + lowBK + "°\n";
      raw += "\n" + emoji2BK + " *Weather (Brooklyn - " + ytDay2 + "):*\n" +
condition2BK + "; Feel: High " + high2BK + "°  Low " + low2BK + "°\n";
    } else {
      raw += "\n" + emojiBK + " *Weather (Brooklyn):*\n" +
conditionBK + "; Feel: High " + highBK + "°  Low " + lowBK + "°\n";
    }

    if (addMonticello) {
      if (isTwoDayMC && ytDay1 && ytDay2) {
        raw += "\n" + emojiMC + " *Weather (Monticello - " + ytDay1 + "):*\n" +
conditionMC + "; Feel: High " + highMC + "°  Low " + lowMC + "°\n";
        raw += "\n" + emoji2MC + " *Weather (Monticello - " + ytDay2 + "):*\n" +
condition2MC + "; Feel: High " + high2MC + "°  Low " + low2MC + "°\n";
      } else {
        raw += "\n" + emojiMC + " *Weather (Monticello):*\n" +
conditionMC + "; Feel: High " + highMC + "°  Low " + lowMC + "°\n";
      }
    }

    raw += "\n🕰 *Zmanim (Brooklyn):*\n" +
"• Candle lighting: " + candleBK + "  \n";
    if (isTwoDayBK && candle2BK) {
      raw += "• Candle lighting 2nd night: " + candle2BK + "  \n";
    }
    raw += "• " + motzeiLabelBK + ": " + motzeiBK + "  \n";

    if (addMonticello) {
      raw += "\n🕰 *Zmanim (Monticello):*\n" +
"• Candle lighting: " + candleMC + "  \n";
      if (isTwoDayMC && candle2MC) {
        raw += "• Candle lighting 2nd night: " + candle2MC + "  \n";
      }
      raw += "• " + motzeiLabelMC + ": " + motzeiMC + "  \n";
    }

    raw += "\n💬 *Quote:*\n" +
"> " + quote;

    window.__rawMessage = raw;

    var html = escapeHtml(raw);
    html = html.replace(/\*(.+?)\*/g, "<b>$1</b>");
    html = html.replace(/^&gt; (.*)$/gm, '<span class="quoteline">$1</span>');

    document.getElementById("preview").innerHTML = html;
  }

  function copyMessage() {
    var text = window.__rawMessage || "";
    var copiedMsg = document.getElementById("copiedMsg");

    function showCopied() {
      copiedMsg.textContent = "✅ Copied! Paste into WhatsApp.";
      setTimeout(function() { copiedMsg.textContent = ""; }, 2500);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showCopied, function() {
        fallbackCopy(text, showCopied);
      });
    } else {
      fallbackCopy(text, showCopied);
    }
  }

  function fallbackCopy(text, cb) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    if (cb) cb();
  }

  function shuffleQuote() {
    var current = document.getElementById("quote").value;
    document.getElementById("quote").value = getRandomQuoteText(current);
    updatePreview();
  }

  function toggleSection(checkboxId, sectionId) {
    var checkbox = document.getElementById(checkboxId);
    var section = document.getElementById(sectionId);
    if (checkbox.checked) {
      section.classList.add("visible");
    } else {
      section.classList.remove("visible");
    }
  }

  document.addEventListener("DOMContentLoaded", function() {
    window.__flower = FLOWERS[Math.floor(Math.random() * FLOWERS.length)];

    document.getElementById("footer").textContent = "A Davidowitz Project © " + new Date().getFullYear();

    document.getElementById("quote").value = quotes[Math.floor(Math.random() * quotes.length)];

    fetchQuotes().then(function() {
      document.getElementById("quote").value = getRandomQuoteText();
      updatePreview();
    });

    var textFields = ["parsha", "additionalText", "highBK", "lowBK", "high2BK", "low2BK",
                       "highMC", "lowMC", "high2MC", "low2MC",
                       "candleBK", "candle2BK", "motzeiBK", "candleMC", "candle2MC", "motzeiMC", "quote",
                       "emojiBK", "emoji2BK", "emojiMC", "emoji2MC"];
    for (var i = 0; i < textFields.length; i++) {
      document.getElementById(textFields[i]).addEventListener("input", updatePreview);
      document.getElementById(textFields[i]).addEventListener("change", updatePreview);
    }

    document.getElementById("includeAdditional").addEventListener("change", function() {
      document.getElementById("additionalText").disabled = !this.checked;
      updatePreview();
    });

    document.getElementById("addMonticello").addEventListener("change", function() {
      var section = document.getElementById("monticelloSection");
      if (this.checked) {
        section.classList.remove("hidden");
      } else {
        section.classList.add("hidden");
      }
      updatePreview();
      if (this.checked && location.protocol !== "file:") {
        var hasData = document.getElementById("candleMC").value;
        if (!hasData) {
          setStatus("Fetching Monticello zmanim & weather...");
          fetchLocation("MC", LOCATIONS.MC.zip, LOCATIONS.MC.lat, LOCATIONS.MC.lon).then(function() {
            setStatus("Done! Review and edit anything that looks off.");
            updatePreview();
          });
        }
      }
    });

    document.getElementById("fetchBtn").addEventListener("click", fetchAll);
    document.getElementById("shuffleBtn").addEventListener("click", shuffleQuote);
    document.getElementById("copyBtn").addEventListener("click", copyMessage);

    updatePreview();
    fetchAll();
  });
</script>
